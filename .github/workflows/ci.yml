name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run type-check

  smoke:
    runs-on: ubuntu-latest
    needs: typecheck
    # The `secrets` context is not allowed in a job-level `if:`, so we expose the connector URL
    # as an env var and gate the smoke STEP on it (the `env` context IS allowed in a step `if:`).
    # Forks / unconfigured repos get an empty string → the step is skipped and the job stays green.
    env:
      MF_CONNECTOR_URL: ${{ secrets.MF_CONNECTOR_URL }}
      MF_INGEST_SECRET: ${{ secrets.MF_INGEST_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Smoke test (only when MF_CONNECTOR_URL secret is configured)
        if: ${{ env.MF_CONNECTOR_URL != '' }}
        run: node scripts/smoke.mjs

  doc-drift:
    runs-on: ubuntu-latest
    needs: typecheck
    env:
      MF_CONNECTOR_URL: ${{ secrets.MF_CONNECTOR_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Doc-drift guard (only when MF_CONNECTOR_URL secret is configured)
        if: ${{ env.MF_CONNECTOR_URL != '' }}
        run: node scripts/doc-drift.mjs
